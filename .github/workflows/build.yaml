name: Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      argocd_version:
        description: "Argo CD version to build"
        required: true
        default: "v3.5.5"
        type: string

env:
  ARGOCD_VERSION: ${{ github.event.inputs.argocd_version || 'v3.5.5' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout Argo CD
        run: |
          git clone https://github.com/argoproj/argo-cd.git
          cd argo-cd
          git checkout ${{ env.ARGOCD_VERSION }}
          git apply < ../breadcrumbs-application-tree.patch

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./argo-cd
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/argocd:${{ env.ARGOCD_VERSION }}
